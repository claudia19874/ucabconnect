
<div class="login-container">
  <div class="login-card">

    <div class="brand-header">
      <img src="/assets/logo.png" alt="Logo UCAB Connect" class="logo-central">
      <h1>UCAB Connect</h1>
      <p>Portal de Pasantías</p>
    </div>

    <div class="tabs-container">
      <button 
        type="button" 
        [class.active]="rolActivo === 'estudiante'"
        (click)="cambiarRol('estudiante')">
         Estudiante
      </button>
      <button 
        type="button" 
        [class.active]="rolActivo === 'empresa'"
        (click)="cambiarRol('empresa')">Empresa</button>
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input 
          type="email" 
          [(ngModel)]="correo" 
          name="correo"
          [placeholder]="rolActivo === 'estudiante' ? 'correo@est.ucab.edu.ve' : 'contacto@empresa.com'" 
          required>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="password-wrapper">
          <input 
            type="password" 
            [(ngModel)]="contrasena" 
            name="contrasena"
            placeholder="Ingresa tu contraseña" 
            required>
          <span class="toggle-password"></span>
        </div>
      </div>

      <div class="forgot-password-container">
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-primary">Iniciar sesión</button>
    </form>

    <div class="divider">
      <span>¿No tienes cuenta?</span>
    </div>

    <div class="register-links">
      <a routerLink="/registro/estudiante" class="btn-outline">
        Registrarme como estudiante
      </a>
      <a routerLink="/registro/empresa" class="btn-outline">
        Registrarme como empresa
      </a>
    </div>

  </div>
  
  <footer class="footer-text">
    Universidad Católica Andrés Bello - UCAB
  </footer>
</div>
