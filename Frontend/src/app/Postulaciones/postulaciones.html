<div class="applications-container">
  <div class="table-responsive">
    <table class="applications-table">
      <thead>
        <tr>
          <th>PASANTÍA</th>
          <th>EMPRESA</th>
          <th>FECHA DE POSTULACIÓN</th>
          <th>ESTADO</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="postulaciones.length === 0">
          <td colspan="4" class="text-center">No registras ninguna postulación activa actualmente.</td>
        </tr>

        <tr *ngFor="let post of postulaciones">
          <td><strong>{{ post.pasantia }}</strong></td>
          <td>{{ post.empresa }}</td>
          <td>{{ post.fecha }}</td>
          <td>
            <span class="status-badge" [ngClass]="{
              'status-review': post.estado === 'En revisión',
              'status-accepted': post.estado === 'Aceptado',
              'status-rejected': post.estado === 'Rechazado'
            }">
              {{ post.estado }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
