<div class="dashboard-container">

  <main class="content" *ngIf="activeTab === 'mis-ofertas'">

    <div class="job-list">
      <div class="job-card-figma" *ngFor="let v of vacantes">
        
        <div class="job-top-row">
          <h2 class="job-title">{{ v.titulo }}</h2>
          <div class="job-actions">
            <span class="badge-status" [ngClass]="v.estado?.toLowerCase() || 'activa'">
              {{ v.estado || 'Activa' }}
            </span>
            
            <button class="btn-action btn-cerrar" (click)="cerrarVacante(v)" *ngIf="v.estado !== 'Cerrada'">
              Cerrar
            </button>
          </div>
        </div>
        
        <div class="job-middle-row">
          <span class="meta-item">📍 {{ v.ubicacion }}</span>
          <span class="meta-item">💵 {{ v.salario }}</span>
          <span class="meta-item">🕐 {{ v.duracion }}</span>
          <span class="badge-modality" [ngClass]="v.modalidad?.toLowerCase()">{{ v.modalidad }}</span>
        </div>
        
        <div class="job-desc-row" *ngIf="v.descripcion">
          <p class="job-desc-text">{{ v.descripcion }}</p>
        </div>
        
      </div>

      <div style="display: flex; justify-content: flex-start; margin-bottom: 24px;">
      <button class="btn-primary-figma" (click)="abrirModalNuevaOferta()">
        + Publicar nueva oferta
      </button>
    </div>

      <div *ngIf="vacantes.length === 0" style="text-align: center; padding: 40px; color: #6b7280;">
        <p>Aún no has publicado ofertas. ¡Crea la primera!</p>
      </div>
    </div>
  </main>

  <div class="modal-overlay" *ngIf="mostrarModal">
    <div class="modal-content form-modal">
      <div class="modal-header">
        <h2>Publicar Nueva Vacante</h2>
        <button class="btn-close" (click)="cerrarModal()">✕</button>
      </div>
      
      <div class="notification-form">
        <div class="form-group">
          <label>Título de la vacante *</label>
          <input type="text" [(ngModel)]="nuevaVacante.titulo" placeholder="Ej: Full Stack Dev">
        </div>
        <div class="form-group">
          <label>Ubicación *</label>
          <input type="text" [(ngModel)]="nuevaVacante.ubicacion" placeholder="Ej: Caracas, Chacao">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label>Salario</label>
            <input type="text" [(ngModel)]="nuevaVacante.salario" placeholder="Ej: $400 - $600 USD">
          </div>
          <div class="form-group">
            <label>Duración</label>
            <input type="text" [(ngModel)]="nuevaVacante.duracion" placeholder="Ej: 6 meses">
          </div>
        </div>
        <div class="form-group">
          <label>Modalidad</label>
          <select [(ngModel)]="nuevaVacante.modalidad">
            <option value="Presencial">Presencial</option>
            <option value="Remoto">Remoto</option>
            <option value="Híbrido">Híbrido</option>
          </select>
        </div>
        <div class="form-group">
          <label>Descripción de la vacante</label>
          <textarea rows="3" [(ngModel)]="nuevaVacante.descripcion" placeholder="Buscamos un estudiante proactivo..."></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-outline" (click)="cerrarModal()">Cancelar</button>
        <button type="button" class="btn-primary" (click)="publicarVacante()">Guardar Vacante</button>
      </div>
    </div>
  </div>
</div>
