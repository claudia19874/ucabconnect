<div class="profile-card">
  <div class="profile-header">
    <div class="profile-avatar">{{ userInitials }}</div>
    <div class="profile-names">
      <h2>{{ miPerfil?.nombre }} {{ miPerfil?.apellido }}</h2>
      <p class="text-muted">{{ miPerfil?.correo }}</p>
      <p class="text-muted">{{ miPerfil?.cedula }}</p>
    </div>
  </div>

  <div class="profile-section">
    <h3>Información Académica</h3>
    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">Carrera</span>
        <span class="info-value">{{ miPerfil?.carrera }}</span>
      </div>
      <div class="info-item">
        <span class="info-label">Semestre</span>
        <span class="info-value">{{ miPerfil?.semestre }}</span>
      </div>
      <div class="info-item">
        <span class="info-label">Sede</span>
        <span class="info-value">{{ miPerfil?.sede }}</span>
      </div>
      <div class="info-item">
        <span class="info-label">Teléfono</span>
        <span class="info-value">{{ miPerfil?.telefono }}</span>
      </div>
    </div>
  </div>

  <div class="profile-section">
    <h3>Habilidades</h3>
    <div class="skills-wrapper">
      <span class="skill-pill" *ngFor="let skill of miPerfil?.habilidades">{{ skill }}</span>
    </div>
  </div>
</div>
